# GOLD Mongolian->English eval set — reversed from the certified en->mn gold.
# input = the certified Mongolian rendering; expected = the original English source.
# Reversal is valid: the English was the SOURCE, so it is a correct mn->en reference.
# English has more surface variation than chrF assumes → min_chrf 0.3.

