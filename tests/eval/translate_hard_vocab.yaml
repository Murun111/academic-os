# HARD-VOCAB eval — uncommon words from Bawden. 19 cases.
# RE-CERTIFIED 2026-07-06 against the column-aware re-extracted (aligned) dictionary.
# Each case carries `expected_any`: the set of valid standard Khalkha Cyrillic
# translations (2 independent Sonnet certifiers + Opus adjudication). chrF scores
# the BEST match over the set, so valid synonyms are no longer penalised. The prior
# single-reference `expected` values were derived from the OLD, column-misaligned
# extraction and unfairly failed correct synonyms — see memory en-mn-translator-c1-handoff.

- id: hv-dominate
  kind: deterministic
  target: translate:en-mn
  input: "dominate"
  match: chrf
  expected: "ноёрхох"
  expected_any: ["ноёрхох", "эрхшээх", "давамгайлах", "зонхилох"]
  min_chrf: 0.4
