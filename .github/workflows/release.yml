name: Build installers

# Tag a release (git tag v0.2.0 && git push --tags) and this builds the
# macOS DMG, a Windows portable zip, and a Linux tarball (Chromebook
# Crostini), then attaches all three to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  LLAMA_BUILD: b10273

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: webui/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: |
          cd webui && npm ci && cd ..
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
      # All third-party code (npm build, PyInstaller + deps) runs in this
      # step, BEFORE the signing certificate exists anywhere on the runner —
      # a compromised dependency can't sign its own payload or exfiltrate an
      # unlocked keychain that isn't there yet.
      - name: Build app (unsigned prep — webui + freeze)
        run: STAGE=prep bash scripts/build_dmg.sh
      - name: Import signing certificate
        if: ${{ secrets.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
      - name: Package, sign, notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: STAGE=package bash scripts/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with: { name: AcademicOS-macOS, path: dist/AcademicOS.dmg }
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: webui/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build webui
        shell: bash
        run: cd webui && npm ci && VITE_API_MODE=real npm run build
      - name: Install backend deps
        run: |
          python -m venv .venv
          .venv/Scripts/pip install -r requirements.txt pyinstaller
      - name: Fetch llama-server (sha256-pinned)
        shell: bash
        run: |
          mkdir -p vendor/llama
          if curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_BUILD/llama-$LLAMA_BUILD-bin-win-cpu-x64.zip" -o llama.zip; then
            echo "8791c5e11cac85b0192b147350731c18bc3621c13a07f4c3932c2ea86c949596  llama.zip" | sha256sum -c - \
              || { echo "FATAL: llama-server zip sha256 mismatch"; exit 1; }
            unzip -o llama.zip -d llama-tmp
            find llama-tmp -name 'llama-server.exe' -exec cp {} vendor/llama/ \;
            find llama-tmp -name '*.dll' -exec cp {} vendor/llama/ \;
          fi
          ls vendor/llama || echo "no llama binaries — app will run without bundled AI"
      - name: Freeze backend
        shell: bash
        run: |
          ADD_LLAMA=""
          [ -f vendor/llama/llama-server.exe ] && ADD_LLAMA='--add-data vendor/llama;vendor/llama'
          .venv/Scripts/pyinstaller --noconfirm --clean --name academic-os \
            --paths . \
            --add-data "webui/dist;webui/dist" \
            --add-data "examples/agents;examples/agents" \
            $ADD_LLAMA \
            --hidden-import backend.app \
            --collect-submodules backend \
            --collect-submodules uvicorn \
            --collect-submodules apscheduler \
            --collect-submodules pydantic \
            scripts/serve_frozen.py
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path dist/academic-os -DestinationPath dist/AcademicOS-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: AcademicOS-windows, path: dist/AcademicOS-windows.zip }

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: webui/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build webui
        run: cd webui && npm ci && VITE_API_MODE=real npm run build
      - name: Install backend deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
      - name: Fetch llama-server (sha256-pinned)
        run: |
          mkdir -p vendor/llama
          if curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_BUILD/llama-$LLAMA_BUILD-bin-ubuntu-x64.tar.gz" -o llama.tgz; then
            echo "62171466b66c3e42e3bbb5168044f181a476dc779ec078debf62dc3a61c1efe2  llama.tgz" | sha256sum -c - \
              || { echo "FATAL: llama-server tarball sha256 mismatch"; exit 1; }
            mkdir -p /tmp/llama-x
            tar -xzf llama.tgz -C /tmp/llama-x
            find /tmp/llama-x -name 'llama-server' -exec cp {} vendor/llama/ \; || true
            find /tmp/llama-x -name '*.so*' -exec cp {} vendor/llama/ \; || true
          fi
          ls vendor/llama || echo "no llama binaries — app will run without bundled AI"
      - name: Freeze backend
        run: |
          ADD_LLAMA=""
          [ -f vendor/llama/llama-server ] && ADD_LLAMA='--add-data vendor/llama:vendor/llama'
          .venv/bin/pyinstaller --noconfirm --clean --name academic-os \
            --paths . \
            --add-data "webui/dist:webui/dist" \
            --add-data "examples/agents:examples/agents" \
            $ADD_LLAMA \
            --hidden-import backend.app \
            --collect-submodules backend \
            --collect-submodules uvicorn \
            --collect-submodules apscheduler \
            --collect-submodules pydantic \
            scripts/serve_frozen.py
      - name: Tar portable app
        run: tar -czf dist/AcademicOS-linux.tar.gz -C dist academic-os
      - uses: actions/upload-artifact@v4
        with: { name: AcademicOS-linux, path: dist/AcademicOS-linux.tar.gz }

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AcademicOS.dmg
            dist/AcademicOS-windows.zip
            dist/AcademicOS-linux.tar.gz
          body: |
            Academic OS — local-first student dashboard.

            **Mac**: download the DMG, drag to Applications, right-click → Open the first time.
            **Windows**: download the zip, extract, run `academic-os.exe` inside.
            **Linux / Chromebook (Crostini)**: extract the tarball, run `./academic-os/academic-os`.
